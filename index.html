<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101114"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ScreenCap"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>ScreenCap</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#eee;font:14px system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}button,input,select{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{z-index:10;background:#181a1f;border-color:#30333a;display:flex;align-items:center;gap:6px;padding:7px max(7px,env(safe-area-inset-right))}.top{border-bottom:1px solid #30333a;padding-top:max(7px,env(safe-area-inset-top))}.bottom{border-top:1px solid #30333a;padding-bottom:max(7px,env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}.bottom::-webkit-scrollbar{display:none}.brand{font-weight:800;letter-spacing:.3px;margin-right:5px;white-space:nowrap}.brand b{color:#74a7ff}.spacer{flex:1}.btn,.tool{border:1px solid #363a42;background:#24272e;color:#eee;border-radius:9px;height:36px;padding:0 11px;white-space:nowrap;cursor:pointer}.btn:hover,.tool:hover{background:#30343d}.tool.active{background:#e8edf6;color:#111;border-color:#e8edf6}.btn:disabled{opacity:.35}.icon{width:36px;padding:0;font-size:17px}.stage{position:relative;overflow:hidden;background-color:#15171b;background-image:linear-gradient(45deg,#1e2025 25%,transparent 25%),linear-gradient(-45deg,#1e2025 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1e2025 75%),linear-gradient(-45deg,transparent 75%,#1e2025 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;color:#969ba5}.empty strong{display:block;color:#eee;font-size:22px;margin-bottom:7px}.empty small{line-height:1.6}canvas{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto}.cropbox{display:none;position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0008;z-index:4;pointer-events:none}.cropbox:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,#fff5 33%,#fff5 calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,#fff5 66%,#fff5 calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(0deg,transparent 33%,#fff5 33%,#fff5 calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,#fff5 66%,#fff5 calc(66% + 1px),transparent calc(66% + 1px))}.options{display:flex;align-items:center;gap:7px;white-space:nowrap}.options label{color:#aeb3bc;font-size:12px}.options input[type=range]{width:90px;accent-color:#ddd}.color{width:34px;height:34px;border:0;padding:2px;background:#333;border-radius:8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(12px);opacity:0;background:#f1f1f1;color:#111;padding:8px 13px;border-radius:20px;z-index:30;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}select{height:36px;border:1px solid #363a42;background:#24272e;color:#eee;border-radius:9px;padding:0 8px}.quality{display:none}.quality.show{display:flex}.drop{outline:2px dashed #7ba8ff;outline-offset:-10px}@media(max-width:650px){.brand{font-size:13px}.top{gap:4px}.top .btn{padding:0 8px}.desktop-label{display:none}.bottom{gap:5px}.tool{height:40px;padding:0 10px}.options input[type=range]{width:70px}.empty strong{font-size:20px}}
</style></head><body><div class="app"><header class="top"><div class="brand">Screen<b>Cap</b></div><button class="btn" id="openBtn">Open</button><button class="btn" id="pasteBtn">Paste</button><button class="btn" id="newBtn">New</button><button class="btn icon" id="undoBtn" title="Undo">↶</button><button class="btn icon" id="redoBtn" title="Redo">↷</button><div class="spacer"></div><button class="btn" id="copyBtn">Copy</button><select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select><button class="btn" id="saveBtn">Save</button><input type="file" id="file" accept="image/*" hidden></header><main class="stage" id="stage"><div class="empty" id="empty"><div><strong>Paste or open a screenshot</strong><small>Ctrl+V · drag & drop · choose from Photos/Files<br>Everything stays on this device.</small></div></div><canvas id="canvas"></canvas><div class="cropbox" id="cropbox"></div></main><footer class="bottom"><button class="tool active" data-tool="pan">↔ <span class="desktop-label">Move</span></button><button class="tool" data-tool="crop">✂ <span class="desktop-label">Crop</span></button><button class="tool" data-tool="erase">⌫ <span class="desktop-label">Erase</span></button><button class="tool" data-tool="heal">✦ <span class="desktop-label">Heal</span></button><button class="tool" data-tool="clone">◎ <span class="desktop-label">Clone</span></button><button class="tool" data-tool="blur">▦ <span class="desktop-label">Blur</span></button><button class="tool" data-tool="draw">✎ <span class="desktop-label">Draw</span></button><button class="tool" data-tool="highlight">▰ <span class="desktop-label">Highlight</span></button><button class="tool" data-tool="fill">◉ <span class="desktop-label">Fill</span></button><button class="tool" id="rotate">↻</button><button class="tool" id="flip">⇆</button><div class="options"><label>Size</label><input id="size" type="range" min="4" max="120" value="28"><input id="color" class="color" type="color" value="#ff3b30"></div><div class="options quality" id="qualityWrap"><label>Quality</label><input id="quality" type="range" min=".2" max="1" step=".05" value=".92"></div><button class="tool hidden" id="applyCrop">✓ Apply crop</button><button class="tool hidden" id="cancelCrop">× Cancel</button><button class="tool" id="fit">Fit</button></footer></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),stage=$('#stage'),empty=$('#empty'),cropbox=$('#cropbox');let has=false,tool='pan',zoom=1,ox=0,oy=0,down=false,last=null,start=null,crop=null,history=[],future=[],cloneSource=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1300)}function snap(){if(!has)return;history.push(canvas.toDataURL('image/png'));if(history.length>25)history.shift();future=[];buttons()}function restore(src,cb){let im=new Image;im.onload=()=>{canvas.width=im.width;canvas.height=im.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);has=true;empty.classList.add('hidden');fit();cb&&cb()};im.src=src}function buttons(){$('#undoBtn').disabled=history.length<2;$('#redoBtn').disabled=!future.length;$('#copyBtn').disabled=$('#saveBtn').disabled=!has;$('#newBtn').disabled=!has}function clearAll(){has=false;canvas.width=1;canvas.height=1;ctx.clearRect(0,0,1,1);history=[];future=[];crop=null;cloneSource=null;zoom=1;ox=oy=0;cropbox.style.display='none';empty.classList.remove('hidden');setTool('pan');buttons();toast('Ready for a new screenshot')}function loadBlob(blob){if(!blob||!blob.type.startsWith('image/'))return;let u=URL.createObjectURL(blob),im=new Image;im.onload=()=>{canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);URL.revokeObjectURL(u);has=true;empty.classList.add('hidden');history=[];future=[];snap();fit();toast(`${canvas.width} × ${canvas.height}`)};im.src=u}function fit(){if(!has)return;let r=stage.getBoundingClientRect(),pad=24;zoom=Math.min((r.width-pad)/canvas.width,(r.height-pad)/canvas.height,1);ox=(r.width-canvas.width*zoom)/2;oy=(r.height-canvas.height*zoom)/2;transform()}function transform(){canvas.style.transform=`translate(${ox}px,${oy}px) scale(${zoom})`;if(crop)drawCrop()}function point(e){let r=stage.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/zoom,y:(e.clientY-r.top-oy)/zoom}}function clampP(p){return{x:Math.max(0,Math.min(canvas.width,p.x)),y:Math.max(0,Math.min(canvas.height,p.y))}}
function brushLine(a,b,mode){let size=+$('#size').value/zoom;ctx.save();ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=size;if(mode==='erase'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000'}else if(mode==='draw'){ctx.strokeStyle=$('#color').value}else if(mode==='highlight'){ctx.strokeStyle=$('#color').value;ctx.globalAlpha=.28;ctx.lineWidth=size*1.7}else if(mode==='fill'){ctx.strokeStyle=$('#color').value}else{ctx.restore();return}ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}function patch(p,mode){let s=Math.max(6,Math.round(+$('#size').value/zoom)),x=Math.round(p.x-s/2),y=Math.round(p.y-s/2);if(mode==='blur'){let sx=Math.max(0,x),sy=Math.max(0,y),w=Math.min(s,canvas.width-sx),h=Math.min(s,canvas.height-sy);if(w<1||h<1)return;let d=ctx.getImageData(sx,sy,w,h),bs=Math.max(4,Math.round(s/7));for(let yy=0;yy<h;yy+=bs)for(let xx=0;xx<w;xx+=bs){let i=((Math.min(h-1,yy+bs/2)|0)*w+(Math.min(w-1,xx+bs/2)|0))*4;ctx.fillStyle=`rgba(${d.data[i]},${d.data[i+1]},${d.data[i+2]},${d.data[i+3]/255})`;ctx.fillRect(sx+xx,sy+yy,bs,bs)}}else if(mode==='heal'){let srcY=Math.max(0,y-s),srcX=Math.max(0,Math.min(canvas.width-s,x));ctx.save();ctx.globalAlpha=.82;ctx.drawImage(canvas,srcX,srcY,s,s,x,y,s,s);ctx.restore()}else if(mode==='clone'&&cloneSource){ctx.drawImage(canvas,cloneSource.x-s/2,cloneSource.y-s/2,s,s,x,y,s,s)}}function drawCrop(){let x=ox+crop.x*zoom,y=oy+crop.y*zoom;cropbox.style.display='block';cropbox.style.left=x+'px';cropbox.style.top=y+'px';cropbox.style.width=crop.w*zoom+'px';cropbox.style.height=crop.h*zoom+'px'}function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));crop=null;cropbox.style.display='none';$('#applyCrop').classList.add('hidden');$('#cancelCrop').classList.add('hidden');cloneSource=null}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
stage.addEventListener('pointerdown',e=>{if(!has)return;stage.setPointerCapture(e.pointerId);down=true;last={x:e.clientX,y:e.clientY};let p=clampP(point(e));start=p;if(tool==='clone'&&e.shiftKey){cloneSource=p;toast('Clone source set');down=false;return}if(['erase','draw','highlight','fill'].includes(tool)){snap();brushLine(p,p,tool)}else if(['heal','blur'].includes(tool)){snap();patch(p,tool)}else if(tool==='clone'){if(!cloneSource){cloneSource=p;toast('Source set — paint elsewhere');down=false}else{snap();patch(p,tool)}}else if(tool==='crop'){crop={x:p.x,y:p.y,w:1,h:1};drawCrop()}});stage.addEventListener('pointermove',e=>{if(!down||!has)return;if(tool==='pan'){ox+=e.clientX-last.x;oy+=e.clientY-last.y;transform()}else{let p=clampP(point(e));if(['erase','draw','highlight','fill'].includes(tool)){brushLine(start,p,tool);start=p}else if(['heal','blur','clone'].includes(tool)){patch(p,tool)}else if(tool==='crop'){crop={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};drawCrop()}}last={x:e.clientX,y:e.clientY}});stage.addEventListener('pointerup',()=>{if(!down)return;down=false;if(tool==='crop'&&crop&&crop.w>3&&crop.h>3){$('#applyCrop').classList.remove('hidden');$('#cancelCrop').classList.remove('hidden')}});stage.addEventListener('wheel',e=>{if(!has)return;e.preventDefault();let r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=zoom,n=Math.max(.08,Math.min(8,zoom*(e.deltaY<0?1.12:.89)));ox=mx-(mx-ox)*n/old;oy=my-(my-oy)*n/old;zoom=n;transform()},{passive:false});
$('#applyCrop').onclick=()=>{if(!crop)return;let x=Math.round(crop.x),y=Math.round(crop.y),w=Math.round(crop.w),h=Math.round(crop.h);snap();let tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(canvas,x,y,w,h,0,0,w,h);canvas.width=w;canvas.height=h;ctx.drawImage(tmp,0,0);crop=null;cropbox.style.display='none';$('#applyCrop').classList.add('hidden');$('#cancelCrop').classList.add('hidden');snap();fit()};$('#cancelCrop').onclick=()=>setTool('crop');$('#rotate').onclick=()=>{if(!has)return;snap();let t=document.createElement('canvas');t.width=canvas.height;t.height=canvas.width;let c=t.getContext('2d');c.translate(t.width,0);c.rotate(Math.PI/2);c.drawImage(canvas,0,0);canvas.width=t.width;canvas.height=t.height;ctx.drawImage(t,0,0);snap();fit()};$('#flip').onclick=()=>{if(!has)return;snap();let t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;let c=t.getContext('2d');c.translate(t.width,0);c.scale(-1,1);c.drawImage(canvas,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(t,0,0);snap()};$('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(history[history.length-1],buttons)};$('#redoBtn').onclick=()=>{if(!future.length)return;let s=future.pop();history.push(s);restore(s,buttons)};$('#newBtn').onclick=clearAll;
$('#openBtn').onclick=()=>$('#file').click();$('#file').onchange=e=>{loadBlob(e.target.files[0]);e.target.value=''};$('#pasteBtn').onclick=async()=>{try{let items=await navigator.clipboard.read();for(let i of items)for(let t of i.types)if(t.startsWith('image/'))return loadBlob(await i.getType(t));toast('No image in clipboard')}catch(e){toast('Use Ctrl+V to paste')}};window.addEventListener('paste',e=>{for(let i of e.clipboardData.items)if(i.type.startsWith('image/')){loadBlob(i.getAsFile());break}});stage.ondragover=e=>{e.preventDefault();stage.classList.add('drop')};stage.ondragleave=()=>stage.classList.remove('drop');stage.ondrop=e=>{e.preventDefault();stage.classList.remove('drop');loadBlob(e.dataTransfer.files[0])};function exportCanvas(type,quality){if(type==='image/jpeg'){let t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;let c=t.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,t.width,t.height);c.drawImage(canvas,0,0);return new Promise(r=>t.toBlob(r,type,quality))}return new Promise(r=>canvas.toBlob(r,type,quality))}$('#format').onchange=()=>$('#qualityWrap').classList.toggle('show',$('#format').value!=='image/png');$('#saveBtn').onclick=async()=>{if(!has)return;let type=$('#format').value,q=+$('#quality').value,b=await exportCanvas(type,q),a=document.createElement('a'),ext=type==='image/png'?'png':type==='image/jpeg'?'jpg':'webp';a.href=URL.createObjectURL(b);a.download=`ScreenCap-${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#copyBtn').onclick=async()=>{if(!has)return;try{let b=await exportCanvas('image/png',1);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Copied')}catch(e){toast('Copy not supported here')}};$('#fit').onclick=fit;window.addEventListener('resize',fit);window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#redoBtn').click():$('#undoBtn').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#saveBtn').click()}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));buttons();
</script></body></html>
